<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <?!= include('common_css'); ?>
    <?!= include('customer_css'); ?>
  </head>
  <body>
    <main class="app-shell">
      <section class="card customer-search-card">
        <h1>لبیک یا مهدی</h1>
        <p class="muted">کد محصول درج‌شده در کاتالوگ را وارد کنید تا اطلاعات محصول نمایش داده شود.</p>

        <form id="product-search-form" class="product-search-form">
          <label for="product-code">کد محصول</label>
          <div class="search-row">
            <input id="product-code" name="productCode" type="text" inputmode="text" placeholder="مثلاً 10M146" autocomplete="off" required>
            <button class="button" type="submit">جستجو</button>
          </div>
        </form>

        <p id="product-message" class="message" role="status"></p>

        <article id="product-result" class="product-result" hidden>
          <img id="product-image" class="product-image" alt="تصویر محصول" hidden>
          <dl class="product-fields">
            <div><dt>نام محصول</dt><dd id="product-name"></dd></div>
            <div><dt>کد محصول</dt><dd id="product-result-code"></dd></div>
            <div><dt>جنس</dt><dd id="product-material"></dd></div>
            <div><dt>سایز</dt><dd id="product-size"></dd></div>
            <div><dt>قیمت</dt><dd id="product-price"></dd></div>
            <div><dt>توضیحات</dt><dd id="product-description"></dd></div>
            <div><dt>وضعیت موجودی</dt><dd id="product-stock-status"></dd></div>
          </dl>
        </article>

        <!-- Payment receipt form -->
        <section class="card payment-receipt-card">
          <h2>ارسال رسید پرداخت</h2>
          <form id="payment-receipt-form" class="payment-form">
            <label for="pay-order-code">کد سفارش</label>
            <input id="pay-order-code" name="orderCode" type="text" placeholder="مثلاً 20260804-1A2B" required>

            <label for="pay-mobile">شماره موبایل</label>
            <input id="pay-mobile" name="mobile" type="tel" placeholder="0912xxxxxxx" required>

            <label for="pay-amount">مبلغ پرداخت (تومان)</label>
            <input id="pay-amount" name="amount" type="number" min="1" required>

            <label for="pay-method">روش پرداخت</label>
            <select id="pay-method" name="paymentMethod" required>
              <option value="bank_transfer">انتقال بانکی</option>
              <option value="card">کارت به کارت</option>
              <option value="cash">حضوری</option>
            </select>

            <label for="pay-receipt-url">لینک/آدرس رسید (اختیاری)</label>
            <input id="pay-receipt-url" name="receiptImageUrl" type="url" placeholder="آدرس تصویر یا رسید">

            <label for="pay-description">توضیحات (اختیاری)</label>
            <textarea id="pay-description" name="description" rows="2"></textarea>

            <div class="form-actions">
              <button type="submit" class="button">ارسال رسید</button>
            </div>

            <p id="payment-message" class="message" role="status"></p>
          </form>
        </section>

      </section>
    </main>

    <?!= include('customer_js'); ?>
  </body>
</html>
